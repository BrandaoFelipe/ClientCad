<div class="row">
    <div class="layout">
        <form class="mt-60" #clientessform="ngForm" (ngSubmit)="salvar()">
            <mat-card>
                <mat-card-header>
                    <mat-card-title> DADOS PESSOAIS </mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">

                    <div class="linha-formulario">
                        <mat-form-field class="full-width">
                            <mat-label> Nome: *</mat-label>
                            <input type="text" name="nome" [(ngModel)]="cliente.name"  placeholder="Ex: Maximillian Swartzmuller" matInput />
                        </mat-form-field>
                    </div>

                    <div class="linha-formulario">
                        <mat-form-field class="full-width">
                            <mat-label> Email: *</mat-label>
                            <input type="email" name="email" [(ngModel)]="cliente.email" placeholder="Digite seu email" matInput />
                        </mat-form-field>
                    </div>

                    <div class="linha-formulario-cpf">
                        <mat-form-field class="full-width">
                            <mat-label> CPF: *</mat-label>
                            <input type="text" name="cpf" [(ngModel)]="cliente.cpf" placeholder="Digite seu CPF" matInput />
                        </mat-form-field>
                    </div>

                    <div class="linha-formulario-data-nascimento">
                        <mat-form-field class="full-width">
                            <mat-label> Data Nascimento: *</mat-label>
                            <input type="date" name="dataNascimento" [(ngModel)]="cliente.dataNascimento" placeholder="Digite sua data de nascimento" matInput />
                        </mat-form-field>
                    </div>
                </mat-card-content>

                <div class="alinhamento-row">
                    <div class="alinhamento-column">
                        <mat-card-actions>
                            <button mat-flat-button color="primary" type="submit">
                                <mat-icon fontIcon="save"></mat-icon>
                                Salvar
                            </button>

                            <button mat-flat-button color="primary" class="ml-5">
                                <mat-icon fontIcon="refresh"></mat-icon>
                                Atualizar
                            </button>

                            <button mat-flat-button color="accent" class="ml-5">
                                <mat-icon fontIcon="backspace"></mat-icon>
                                Limpar
                            </button>
                        </mat-card-actions>
                    </div>
                </div>
            </mat-card>
        </form>
    </div>
</div>
